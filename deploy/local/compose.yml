services:
  ui:
    build:
      context: ../../frontend
      args:
        VITE_ORCHESTRATOR_URL: /api/chat
        VITE_OPENAI_API_ENDPOINT: ${OPENAI_API_ENDPOINT:-}
        VITE_OPENAI_API_TOKEN: ${OPENAI_API_TOKEN:-}
        VITE_OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "8080:8080"
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      orchestrator:
        condition: service_started
    restart: unless-stopped
  orchestrator:
    build:
      context: ../../orchestrator/src
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      PYTHONUNBUFFERED: "1"
      TOOL_SERVERS: >-
        http://risk:7001, http://portfolio:7002, http://guidelines:7003
      GUARDRAILS_URL: "http://guardrails:8000"
    depends_on:
      risk:
        condition: service_started
      portfolio:
        condition: service_started
      guidelines:
        condition: service_started
      guardrails:
        condition: service_started
    restart: unless-stopped
  guardrails:
    build:
      context: ../../tools/guardrails/src
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      PYTHONUNBUFFERED: "1"
      GUARDRAILS_CONFIG_PATH: "/config"
    volumes:
      - ../../tools/guardrails/config:/config:ro,z
    restart: unless-stopped
  risk:
    build:
      context: ../../tools/value_at_risk/src
    ports:
      - "7001:7001"
    environment:
      PORT: "7001"
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
  portfolio:
    build:
      context: ../../tools/portfolio/src
    ports:
      - "7002:7002"
    environment:
      PORT: "7002"
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
  aws-compatible-storage:
    image: quay.io/rh-aiservices-bu/s4:0.3.2
    ports:
      - "7480:7480"
      - "5001:5000" # Host 5000 is already used by the orchestrator.
    environment:
      AWS_ACCESS_KEY_ID: s4admin
      AWS_SECRET_ACCESS_KEY: s4secret
      AWS_S3_ENDPOINT: http://localhost:7480
      AWS_DEFAULT_REGION: us-east-1
      UI_USERNAME: admin
      UI_PASSWORD: changeme
      COOKIE_REQUIRE_HTTPS: "false"
    volumes:
      - storage-data:/var/lib/ceph/radosgw
    restart: unless-stopped
  model-upload:
    image: registry.access.redhat.com/ubi10/python-312-minimal:latest
    depends_on:
      aws-compatible-storage:
        condition: service_started
    environment:
      HOME: /tmp
      PYTHONPATH: /tmp/python
      AWS_ACCESS_KEY_ID: s4admin
      AWS_SECRET_ACCESS_KEY: s4secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        pip install --no-cache-dir -q --target /tmp/python boto3==1.40.76
        python - <<'PYTHON'
        import time
        from urllib.request import urlopen

        import boto3
        from botocore.config import Config
        from botocore.exceptions import BotoCoreError, ClientError

        client = boto3.client(
            "s3", endpoint_url="http://aws-compatible-storage:7480",
            config=Config(s3={"addressing_style": "path"},
                          connect_timeout=5, read_timeout=10),
        )
        for attempt in range(90):
            try:
                with urlopen("http://aws-compatible-storage:5000/api", timeout=5):
                    pass
                client.list_buckets()
                break
            except (OSError, BotoCoreError, ClientError):
                if attempt == 89:
                    raise
                print("Waiting for storage...", flush=True)
                time.sleep(2)
        try:
            client.head_bucket(Bucket="models")
        except ClientError as error:
            if error.response["Error"]["Code"] not in ("404", "NoSuchBucket"):
                raise
            client.create_bucket(Bucket="models")
        print("Storage bucket ready (model served from MLServer image locally)")
        PYTHON
    restart: "no"
  mlserver:
    build:
      context: ../..
      dockerfile: tools/guidelines-model/Dockerfile
    ports:
      - "8081:8080"
    restart: unless-stopped
  guidelines:
    build:
      context: ../../tools/guidelines/src
    ports:
      - "7003:7003"
    environment:
      PORT: "7003"
      PYTHONUNBUFFERED: "1"
      INFERENCE_URL: "http://mlserver:8080"
    volumes:
      - ../../tools/guidelines/docs:/app/docs:ro,z
    depends_on:
      mlserver:
        condition: service_started
    restart: unless-stopped
volumes:
  storage-data:
