{{- $storage := index .Values "aws-compatible-storage" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "investment-advisor-agent.storageSecret" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    serving.kserve.io/s3-endpoint: {{ include "investment-advisor-agent.storageEndpoint" . | quote }}
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-region: us-east-1
    serving.kserve.io/s3-usevirtualbucket: "false"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ $storage.s3.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $storage.s3.secretAccessKey | quote }}
  {{- if $storage.auth.enabled }}
  UI_USERNAME: {{ required "Storage UI username is required" $storage.auth.username | quote }}
  UI_PASSWORD: {{ required "Storage UI password is required" $storage.auth.password | quote }}
  {{- if $storage.auth.jwtSecret }}
  JWT_SECRET: {{ $storage.auth.jwtSecret | quote }}
  {{- end }}
  {{- end }}
